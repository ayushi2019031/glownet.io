<header class="site-header" role="banner">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    renderMathInElement(document.body, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "\\(", right: "\\)", display: false },
        { left: "$", right: "$", display: false }
      ],
      throwOnError: false
    });
  });
</script>
  <div class="masthead">
    <a class="masthead__brand" href="{{ "/" | relative_url }}">
      <svg class="masthead__mark"><use href="#g-lamp-mark"></use></svg>
      <span class="masthead__word">Glownet</span>
    </a>

    <nav class="masthead__nav" aria-label="Primary">
      <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>writing</a>
      <a href="{{ "/musings/" | relative_url }}"{% if page.url == "/musings/" %} aria-current="page"{% endif %}>musings</a>
      <a href="{{ "/about/" | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>about</a>
    </nav>
  </div>
</header>
